[workspace]
resolver = "2"
members = ["crates/micdock-core", "crates/micdock-cli", "crates/micdock-app"]

[workspace.package]
version = "0.11.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["MicDock authors <milo@ilom.nl>"]
repository = "https://github.com/micdock/micdock"
homepage = "https://github.com/micdock/micdock"
rust-version = "1.93"

[workspace.dependencies]
libc = "0.2"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
filetime = "0.2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
ureq = "2"
serde_json = "1"
md-5 = "0.10"
crc32fast = "1"
regex = "1"
sha1 = "0.10"
htmlize = { version = "1", features = ["unescape"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
micdock-core = { path = "crates/micdock-core" }

[profile.release]
lto = "thin"
strip = true
