# CodeQL code scanning, only for what lands on `main` (not for every pull request or on a schedule).
# This replaces GitHub's "default setup", whose triggers can't be changed: switch that off under
# Settings → Code security → Code scanning → CodeQL analysis → ⋯ → Disable, or both will run.
name: CodeQL

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      security-events: write # upload the results to the Security tab
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
            build-mode: none # analyses the source without a full build (no libcosmic compile needed)
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
