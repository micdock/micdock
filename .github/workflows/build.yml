# Build and check MicDock on every push and pull request; on a version tag (v1.2.3) also publish a
# GitHub release with the Linux archive.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libxkbcommon-dev

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings

      - name: Tests
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Archive
        working-directory: .
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF" in refs/tags/v*) ;; *) version="$(git rev-parse --short HEAD)" ;; esac
          packaging/make-release.sh "$version"

      - uses: actions/upload-artifact@v4
        with:
          name: micdock-linux-x86_64
          path: dist/micdock-*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: micdock-linux-x86_64
          path: dist

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## /{p = index($0, "## " v) == 1; next} p' CHANGELOG.md > notes.md
          cat >> notes.md <<'EOF'

          ### Install

          Download `micdock-*-x86_64-linux.tar.gz`, unpack it and run `./install.sh` (for your user) or
          `sudo ./install.sh --system` (for everyone, including the udev rule). Needs a desktop with Wayland or X11;
          `ffmpeg` for MP3 export and `udisks2` for the transmitters' drives.
          EOF

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          name: MicDock ${{ github.ref_name }}
          body_path: notes.md
          files: dist/micdock-*
