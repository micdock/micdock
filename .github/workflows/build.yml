# Build and check MicDock on every push and pull request; on a version tag (v1.2.3) also publish a
# GitHub release with the Linux archives.
#
# The builds run inside AlmaLinux 9 (glibc 2.34), so the binaries also start on older distributions:
# everything with glibc 2.34 or newer (Ubuntu 22.04+, Debian 12+, RHEL/Alma/Rocky 9+, Fedora 35+,
# openSUSE Leap 15.6, Arch, …). A binary built against a newer glibc would refuse to start there.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: almalinux:9
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: System packages
        run: |
          dnf -y install --enablerepo=crb gcc make pkgconf-pkg-config alsa-lib-devel libxkbcommon-devel git
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v4

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
          key: ${{ matrix.arch }}

      - name: Formatting
        if: matrix.arch == 'x86_64'
        working-directory: src
        run: cargo fmt --all --check

      - name: Clippy
        if: matrix.arch == 'x86_64'
        working-directory: src
        run: cargo clippy --release --locked --all-targets -- -D warnings

      - name: Tests
        working-directory: src
        run: cargo test --release --locked

      - name: Build
        working-directory: src
        run: cargo build --release --locked

      - name: Archive
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF" in refs/tags/v*) ;; *) version="$(git rev-parse --short HEAD)" ;; esac
          packaging/make-release.sh "$version"

      - uses: actions/upload-artifact@v4
        with:
          name: micdock-linux-${{ matrix.arch }}
          path: dist/micdock-*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: micdock-linux-*
          merge-multiple: true
          path: dist

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## /{p = index($0, "## " v) == 1; next} p' CHANGELOG.md > notes.md
          cat >> notes.md <<'EOF'

          ### Download and install

          - `micdock-*-x86_64-linux.tar.gz` for Intel/AMD PCs, `micdock-*-aarch64-linux.tar.gz` for 64-bit ARM.
          - Runs on Linux with glibc 2.34 or newer (Ubuntu 22.04+, Debian 12+, Fedora, RHEL/Alma/Rocky 9+,
            openSUSE, Arch, …), on Wayland or X11.
          - Unpack it and run `./install.sh` (for your user; it prints the `sudo` command for the udev rule) or
            `sudo ./install.sh --system` (for everyone). `ffmpeg` is needed for MP3 export, `udisks2` for the
            transmitters' drives.
          EOF

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          name: MicDock ${{ github.ref_name }}
          body_path: notes.md
          files: dist/micdock-*
